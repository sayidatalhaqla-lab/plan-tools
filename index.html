<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F2A44">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أدوات المخطط">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>أدوات المخطط</title>
<style>
:root{--bg:#EDEFEA;--card:#F8F9F6;--ink:#1B2233;--navy:#1F2A44;--blue:#2457A6;--green:#2F6B54;--red:#D32F2F;--line:#CBD0C8;--mut:#5C6577}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,"Noto Sans Arabic","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:70px}
header{background:var(--navy);color:#fff;padding:8px 10px;display:flex;align-items:center;gap:8px}
header h1{margin:0;font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn[disabled]{opacity:.35}
.btn.big{min-height:54px;font-size:18px;display:flex;align-items:center;justify-content:center}
#sheet{position:fixed;inset:0;z-index:60;display:none;background:#0008}
#sheet.open{display:flex;align-items:flex-end}
#sheet .sh{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px 24px}
#sheet .dr-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#1B2233EE;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;z-index:70;display:none;max-width:90vw;text-align:center}
input.nm{width:100%;margin:6px 0 2px;padding:8px 10px;border:1px dashed #B9C0B4;border-radius:8px;font:inherit;font-size:14px;background:#fff}
body:not(.alltabs) nav#tabs button.adv{display:none}
body.alltabs #moreBtn{display:none}
body.field #panel{font-size:17px}
body.field .big{font-size:34px}
body.field .kv{font-size:16px}
body.field #hint{font-size:15px}
.ok{color:#0B8457;font-weight:700}
.bad{color:#B4530A;font-weight:700}
.hbtn{min-height:40px;padding:0 12px;border-radius:10px;border:1.5px solid #ffffff55;background:#ffffff18;color:#fff;font:inherit;font-size:14px;display:flex;align-items:center;cursor:pointer}
#fileBar{background:#fff;border-bottom:1px solid var(--line);padding:6px 10px;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#fileBar .grow{flex:1;min-width:120px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:2px 10px;font:inherit;font-size:13px;color:var(--ink)}
.chip.warn{border-color:#E0642A;color:#9A3412}
.viewer{position:sticky;top:0;z-index:5;background:#fff;border-bottom:2px solid var(--navy)}
#wrap{height:42vh;position:relative;overflow:hidden;touch-action:none}
#cv{width:100%;height:100%;display:block;touch-action:none}
#loupe{position:absolute;top:8px;right:8px;width:120px;height:120px;border-radius:50%;border:3px solid var(--navy);box-shadow:0 2px 12px #0007;background:#fff;display:none;pointer-events:none;z-index:6}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);text-align:center;padding:20px;pointer-events:none}
.tools{display:flex;gap:6px;padding:6px;background:var(--card);overflow-x:auto}
.tools button{flex:1 0 auto;min-height:42px;padding:0 12px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font:inherit;font-size:14px;color:var(--ink)}
.tools button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tools.sub button{min-height:38px;font-size:13px}
#hint{padding:5px 12px;font-size:13px;color:var(--mut);background:#fff;min-height:28px}
main{padding:10px;display:grid;gap:10px;max-width:720px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.card .big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kv{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid var(--line)}
.kv b{font-variant-numeric:tabular-nums;text-align:left}
.card table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px;margin-top:6px}
.card th{font-size:12px;color:var(--mut);font-weight:600;text-align:right;padding:4px 2px}
.card td{padding:5px 2px;border-top:1px solid var(--line);text-align:right}
.sel{border-color:var(--navy);box-shadow:0 0 0 2px #1F2A4433}
label{display:block;font-size:14px;margin:8px 0 2px;color:var(--mut)}
input[type=number],input[type=text],select{width:100%;min-height:42px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;background:#fff;color:var(--ink)}
.btn{min-height:42px;border:0;border-radius:10px;padding:0 14px;font:inherit;font-weight:700;background:var(--blue);color:#fff;width:100%;margin-top:8px}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.g{background:var(--green)}
.btn.sm{min-height:34px;width:auto;margin:0;padding:0 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:flex-end}.row>*{flex:1}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}
.warn{color:#9A3412;font-size:13px}
.cm{font-size:.78em;color:var(--mut);font-weight:400;white-space:nowrap;margin-inline-start:.35em}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:6px;border:1px solid #0003;vertical-align:-1px}
details{margin-top:8px}details summary{min-height:38px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.status{font-size:14px;padding:8px 10px;border-radius:8px;background:#fff;border:1px dashed var(--line)}
.out div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.out div b{font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;margin-top:6px}
.seg button{flex:1;min-height:40px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font:inherit}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.row2{display:flex;gap:6px;align-items:center;margin-top:6px}.row2>select{flex:1.4}.row2>input{flex:1;min-width:0}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--navy);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
nav#tabs button{flex:1;min-height:54px;border:0;background:transparent;color:#B8C0D4;font:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:10px}
nav#tabs button .ic{font-size:20px;line-height:1}
nav#tabs button.on{background:#ffffff22;color:#fff;font-weight:700}
#drawer{position:fixed;inset:0;z-index:50;display:none;background:#0008}
#drawer.open{display:block}
#drawer .dr{position:absolute;top:0;bottom:0;right:0;width:min(360px,92vw);background:var(--bg);overflow:auto;padding:12px;box-shadow:-4px 0 16px #0006}
#drawer h3{margin:14px 0 4px;font-size:15px}
#drawer .dr-h{display:flex;align-items:center;justify-content:space-between}
#drawer label.ck{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px;margin:6px 0}
#drawer pre{white-space:pre-wrap;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;margin:0}
.file-in{position:absolute;width:1px;height:1px;opacity:0}
</style>
</head>
<body>
<header>
  <button class="hbtn" data-a="menu" aria-label="القائمة">⋯</button>
  <h1>أدوات المخطط</h1>
  <button class="hbtn" data-a="undo" id="bUndo" aria-label="تراجع" disabled>↶</button>
  <button class="hbtn" data-a="redo" id="bRedo" aria-label="إعادة" disabled>↷</button>
  <label class="hbtn" for="file">فتح ملف</label>
  <input type="file" id="file" class="file-in" accept="application/pdf,.pdf,image/*">
</header>
<div id="fileBar"><span class="grow" id="fileName">ما في ملف. اضغط «فتح ملف» (PDF أو صورة).</span></div>

<div class="viewer">
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="empty">اضغط «فتح ملف» فوق<br>واختار PDF أو صورة.</div>
    <canvas id="loupe"></canvas>
  </div>
  <div class="tools" id="tb"></div>
  <div class="tools sub" id="tb2" style="display:none"></div>
  <div id="hint"></div>
</div>

<main id="panel"></main>

<nav id="tabs">
  <button data-a="tool" data-t="areas"><span class="ic">▦</span>مساحات</button>
  <button data-a="tool" data-t="lines"><span class="ic">〰</span>خطوط</button>
  <button class="adv" data-a="tool" data-t="circles"><span class="ic">◎</span>دوائر</button>
  <button class="adv" data-a="tool" data-t="angles"><span class="ic">∠</span>زوايا</button>
  <button class="adv" data-a="tool" data-t="slope"><span class="ic">◢</span>ميلان</button>
  <button data-a="tool" data-t="mats"><span class="ic">▤</span>مواد</button>
  <button data-a="more" id="moreBtn"><span class="ic">⋯</span><span id="moreLbl">المزيد</span></button>
</nav>

<div id="drawer"><div class="dr">
  <div class="dr-h"><b>الإعدادات</b><button class="hbtn" style="background:#fff;color:#1B2233;border-color:#CBD0C8" data-a="menu">إغلاق</button></div>

  <h3>الشغل</h3>
  <button class="btn" data-a="projects">🗂 مشاريعي</button>
  <button class="btn alt" data-a="report">📄 تقرير (صورة ونص)</button>
  <label class="ck"><input type="checkbox" data-c="opt" data-k="field"> وضع الموقع: أرقام أكبر والشاشة ما بتنطفي</label>
  <label class="ck"><input type="checkbox" data-c="opt" data-k="allTabs"> إظهار كل الأدوات بالشريط تحت</label>

  <h3>الملف</h3>
  <label>رقم الصفحة (للـ PDF)</label>
  <input type="number" id="pageIn" min="1" value="1" inputmode="numeric" data-c="page">
  <p class="warn" id="fileMsg"></p>

  <h3>المقياس</h3>
  <div class="status" id="scaleBox">غير محدد.</div>
  <button class="btn alt" data-a="calOn">معايرة يدوية من بُعد معروف</button>
  <div id="calBox" style="display:none">
    <p class="mut">اضغط على طرفي بُعد معروف بالرسم، وبعدين اكتب طوله.</p>
    <div class="row"><div><label>الطول (ft)</label><input type="number" id="calLen" step="any" inputmode="decimal"></div><div><button class="btn" data-a="calApply">اعتمد</button></div></div>
    <p class="mut" id="calInfo"></p>
  </div>
  <button class="btn alt" data-a="clrRefs">مسح المقاييس اليدوية</button>

  <h3>العرض</h3>
  <label class="ck"><input type="checkbox" data-c="opt" data-k="cm" checked> إظهار السنتيمتر (cm) بجانب القدم</label>
  <label class="ck"><input type="checkbox" data-c="opt" data-k="showAnn" checked> قياسات الـ PDF كما هي بالملف</label>
  <label class="ck"><input type="checkbox" data-c="opt" data-k="showOv"> رسم قياسات الـ PDF بواسطة البرنامج</label>
  <label class="ck"><input type="checkbox" data-c="opt" data-k="showLbl" checked> أرقام المساحات على القطع</label>
  <label class="ck"><input type="checkbox" data-c="opt" data-k="showOutl" checked> حدود قطع الـ PDF</label>
  <label class="ck"><input type="checkbox" data-c="opt" data-k="snapLines" checked> التقاط على خطوط الرسم نفسها (مش بس قياسات الـ PDF)</label>
  <label class="ck"><input type="checkbox" data-c="opt" data-k="snap"> التقاط نقاطي على رؤوس مضلعات الـ PDF</label>
  <label>وحدة الطول</label>
  <div class="seg" id="fmtSeg"><button data-a="fmt" data-f="dec" class="on">قدم عشري</button><button data-a="fmt" data-f="ftin">قدم-إنش</button></div>

  <h3>تشخيص الملف</h3>
  <pre id="diag">—</pre>
  <h3>مساعدة</h3>
  <button class="btn alt" data-a="guide">📘 دليل الاستخدام</button>
  <button class="btn alt" data-a="news">✨ شو الجديد</button>
  <p class="mut" id="verTxt"></p>
</div></div>

<div id="sheet"><div class="sh"><div class="dr-h"><b id="shTitle"></b><button class="hbtn" style="background:#fff;color:#1B2233;border-color:#CBD0C8" data-a="shClose">إغلاق</button></div><div id="shBody"></div></div></div>
<div id="toast"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d'),wrap=$('#wrap');
const R=Math.PI/180,D=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const iso=t=>'\u2066'+t+'\u2069';
const med=a=>{const b=[...a].sort((x,y)=>x-y),n=b.length;return n?(n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2):null};
const nameFor=k=>{const L=String.fromCharCode(65+k%26);return k<26?L:L+Math.floor(k/26)};
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nmIn=(k,id,v,ph)=>'<input class="nm" placeholder="'+ph+'" value="'+esc(v||'')+'" data-c="nm" data-k="'+k+'" data-id="'+id+'">';
const stripMk=t=>cmText(String(t)).replace(/[\u2066\u2069]/g,'');

// ================= state =================
const S={base:null,baseAnn:null,px:null,W:0,H:0,view:{s:1,x:0,y:0},dpr:window.devicePixelRatio||1,
  pxFt:null,refs:[],dims:[],polys:[],ann:[],pieces:[],spread:null,err:null,diag:'',plabels:[],kappa:1,usePrinted:false,pxPerPt:1,autoPage:false,buf:null,pdfPage:null,origin:null,ang:0,hi:null,hiTimer:0,hiTok:0,hiTask:null,
  file:null,name:'',page:1,pages:0,isPdf:false,
  fmt:'dec',cm:true,snapLines:true,field:false,allTabs:false,fsize:0,fileBlob:null,showAnn:true,showOv:false,showLbl:true,showOutl:true,snap:false,log:[]};
const CAL={on:false,pts:[]};
let tool='areas',ptrs=new Map(),tapStart=null,pinch=null,dragH=null,raf=0;

// ================= formatting =================
function ftIn(ft){
  let f=Math.floor(ft+1e-9),inch=Math.round((ft-f)*12*8)/8;if(inch>=12){f++;inch-=12}
  const w=Math.floor(inch+1e-9);let n=Math.round((inch-w)*8),d=8;while(n&&n%2===0){n/=2;d/=2}
  return f+"'-"+w+(n?' '+n+'/'+d:'')+'"';
}
const CMS='\u2061',CME='\u2062';                                  // invisible markers around the centimetre part
const fFt=ft=>iso(S.fmt==='dec'?ft.toFixed(2)+' ft':ftIn(ft))+(S.cm?CMS+(ft*30.48).toFixed(1)+' cm'+CME:'');
const cmHtml=h=>h.replace(/\u2061([^\u2062]*)\u2062/g,'<span class="cm">$1</span>');
const cmText=t=>String(t).replace(/\u2061([^\u2062]*)\u2062/g,' · $1');
const sf2=(v,d=2)=>iso(v.toFixed(d)+' sf');
const fK=(px,k)=>k?fFt(px/k):iso(Math.round(px)+' px');
const altFt=ft=>iso(S.fmt==='dec'?ftIn(ft):ft.toFixed(2)+' ft');           // the same length written the other way (decimal feet <-> feet-inches)
const altK=(px,k)=>k?'= '+altFt(px/k):'';
const cen=pts=>{const n=pts.length||1;let x=0,y=0;pts.forEach(p=>{x+=p.x!==undefined?p.x:p[0];y+=p.y!==undefined?p.y:p[1]});return[x/n,y/n]};

// ================= printed scale labels ("Scale: 1:200") =================
function findScaleLabels(items,toPx){
  const its=items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width||0})),out=[];
  its.forEach(it=>{
    if(!/scale/i.test(it.s))return;
    let txt=it.s,cur=it;
    const near=its.filter(o=>o!==it&&Math.abs(o.y-it.y)<3&&o.x>it.x).sort((a,b)=>a.x-b.x);
    for(const o of near){if(o.x-(cur.x+cur.w)<40){txt+=' '+o.s;cur=o}}
    const m=txt.match(/scale\s*:?\s*1\s*:\s*(\d+(?:\.\d+)?)/i);
    if(m){const p=toPx(cur.x+cur.w,cur.y);out.push({N:parseFloat(m[1]),x:p[0],y:p[1]})}
  });
  return out}
// the label of the drawing a point belongs to: labels sit at the bottom-right corner of their drawing
function printedAt(x,y){
  if(!S.plabels.length)return null;const pad=0.02*S.W;
  let c=S.plabels.filter(l=>x<=l.x+pad&&y<=l.y+pad);if(!c.length)c=S.plabels;
  let best=null,bd=Infinity;c.forEach(l=>{const d=Math.hypot(l.x-x,l.y-y);if(d<bd){bd=d;best=l}});
  return best?{N:best.N,k0:S.pxPerPt*864/best.N}:null}   // 864 pt = 1 ft at 1:1
function calibratePrinted(){ // do the printed scales agree with the measured dimensions?
  S.kappa=1;S.usePrinted=false;if(!S.plabels.length)return;
  const r=[];S.dims.forEach(d=>{const p=printedAt(d.mid[0],d.mid[1]);if(p)r.push((d.len/d.ft)/p.k0)});
  if(r.length>=3){S.kappa=med(r);S.usePrinted=Math.abs(S.kappa-1)<0.05}else S.usePrinted=true}
function scaleNoteAt(x,y){
  let best=null,bd=Infinity;S.refs.forEach(r=>{const d=Math.hypot(r.x-x,r.y-y);if(d<bd){bd=d;best=r}});
  if(best&&bd<0.4*Math.max(S.W,S.H))return 'يدوي';
  if(S.usePrinted){const p=printedAt(x,y);if(p)return '1:'+p.N+' (مطبوع بالرسمة)'}
  if(S.dims.length>=3)return 'من أبعاد الملف';return S.pxFt?'عام':'غير محدد'}
const scaleNote=pts=>{const c=cen(pts);return scaleNoteAt(c[0],c[1])};
// ================= coordinates: X to the right, Y up, in feet from an origin =================
const originPt=()=>S.origin||{x:0,y:S.H,def:true};          // default origin = bottom-left corner of the page
// the axes: X along angle S.ang (0 = page horizontal), Y perpendicular (counter-clockwise); canvas coords (y down)
function frame(){const o=originPt(),a=(S.ang||0)*R;return{o,ux:[Math.cos(a),-Math.sin(a)],uy:[-Math.sin(a),-Math.cos(a)]}}
function coordOf(x,y){const F=frame(),o=F.o,d=[x-o.x,y-o.y],px=d[0]*F.ux[0]+d[1]*F.ux[1],py=d[0]*F.uy[0]+d[1]*F.uy[1],
    k=scaleAt((o.x+x)/2,(o.y+y)/2),n1=scaleNoteAt(o.x,o.y),n2=scaleNoteAt(x,y);
  return{k,dx:px,dy:py,X:k?px/k:null,Y:k?py/k:null,dist:Math.hypot(d[0],d[1]),warn:n1!==n2&&(/1:/.test(n1)||/1:/.test(n2))}}
function centerOrigin(){const r=wrap.getBoundingClientRect(),v=S.view;S.origin={x:Math.min(S.W,Math.max(0,(r.width/2-v.x)/v.s)),y:Math.min(S.H,Math.max(0,(r.height/2-v.y)/v.s))};S.ang=0}
const fSgn=v=>v===null?'—':((v<-1e-9?'−':'')+fFt(Math.abs(v)));
const coordShort=c=>c.k?(S.fmt==='dec'?c.X.toFixed(2)+', '+c.Y.toFixed(2)+' ft':(c.X<0?'−':'')+ftIn(Math.abs(c.X))+', '+(c.Y<0?'−':'')+ftIn(Math.abs(c.Y)))+(S.cm?' ('+(c.X*30.48).toFixed(1)+', '+(c.Y*30.48).toFixed(1)+' cm)':''):Math.round(c.dx)+', '+Math.round(c.dy)+' px';
const cX=c=>c.k?fSgn(c.X):Math.round(c.dx)+' px',cY=c=>c.k?fSgn(c.Y):Math.round(c.dy)+' px';

// ================= scale (PDF numbers, local per drawing) =================
function scaleAt(x,y){
  let best=null,bd=Infinity;S.refs.forEach(r=>{const d=Math.hypot(r.x-x,r.y-y);if(d<bd){bd=d;best=r}});
  if(best&&bd<0.4*Math.max(S.W,S.H))return best.pxFt;
  if(S.usePrinted){const p=printedAt(x,y);if(p)return p.k0*S.kappa}
  const big=S.dims.filter(d=>d.ft>3),src=big.length>=3?big:S.dims;
  if(src.length>=3){const near=src.map(d=>({r:d.len/d.ft,d:(d.mid[0]-x)**2+(d.mid[1]-y)**2})).sort((a,b)=>a.d-b.d).slice(0,6);const v=med(near.map(n=>n.r));if(v)return v}
  return S.pxFt;
}

    if(h.p&&(h.kind==='mx'||h.kind==='my'||h.kind==='p'))return[h.p.x,h.p.y];

function showLoupe(fx,fy,wx,wy){

function layoutBlock(m,k){
  const sp=Ln.spacing==='q'?0:+Ln.spacing;
  let h='<details><summary>التوقيع على الأرض</summary><div class="mut">وإنت واقف عند أول نقطة ومتجه لثاني نقطة: «يمين» = على يمينك. قيس الانحناء عامودياً على الوتر (الخيط المشدود بين النقطتين).</div>';
  m.segs.forEach(s=>{const a=nameFor(s.from),b=nameFor(s.to);
    h+='<div style="margin-top:8px"><b>'+a+'→'+b+'</b>: وتر '+fK(s.c,k)+' · أقصى انحناء <b>'+fK(s.sag,k)+'</b>'+(s.side?' '+s.side:'');
    if(isFinite(s.R)&&s.sag<=s.c/2){const opp=s.side==='يمين'?'يسار':'يمين';h+='<br><span class="mut">نصف القطر '+fK(s.R,k)+' · مركز القوس على بُعد '+fK(s.R-s.sag,k)+' من منتصف الوتر، جهة ال'+opp+'</span>'}
    h+='</div>';
    if(!isFinite(s.R)){h+='<div class="mut">المقطع مستقيم تقريباً.</div>';return}
    h+='<table><thead><tr><th>المسافة من '+a+' على الوتر</th><th>الانحناء عن الوتر</th></tr></thead><tbody>';
    layoutRows(m.P,s.from,m.curved,sp,k).forEach(r=>{const mm=k?Math.abs(r.off)/k:null;h+='<tr><td>'+fK(r.x,k)+'</td><td>'+(mm!==null&&mm<0.005?'0':fK(Math.abs(r.off),k)+' '+(r.off>0?'يمين':'يسار'))+'</td></tr>'});
    h+='</tbody></table>'});
  return h+'</details>';
}

// ================= TOOL: CIRCLES (fit + manual centre & radius) =================
const C={mode:'pan',rings:[],cur:0,conc:true,man:[],lms:[],idc:1,pickR:null,lastR:10,pc:[]};
function solve(M,b){const n=b.length,A_=M.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(A_[r][c])>Math.abs(A_[p][c]))p=r;if(Math.abs(A_[p][c])<1e-12)return null;[A_[c],A_[p]]=[A_[p],A_[c]];
    for(let r=c+1;r<n;r++){const f=A_[r][c]/A_[c][c];for(let k=c;k<=n;k++)A_[r][k]-=f*A_[c][k]}}
  const x=new Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=A_[i][n];for(let k=i+1;k<n;k++)s-=A_[i][k]*x[k];x[i]=s/A_[i][i]}return x}
function kasa(P){const n=P.length;let mx=0,my=0;P.forEach(p=>{mx+=p.x;my+=p.y});mx/=n;my/=n;
  let Suu=0,Suv=0,Svv=0,Suuu=0,Svvv=0,Suvv=0,Svuu=0;
  P.forEach(p=>{const u=p.x-mx,v=p.y-my;Suu+=u*u;Suv+=u*v;Svv+=v*v;Suuu+=u*u*u;Svvv+=v*v*v;Suvv+=u*v*v;Svuu+=v*u*u});
  const s=solve([[Suu,Suv],[Suv,Svv]],[0.5*(Suuu+Suvv),0.5*(Svvv+Svuu)]);return s?{a:mx+s[0],b:my+s[1]}:null}
function fitGroups(G,conc){
  const all=[].concat(...G);if(all.length<3)return null;
  if(!conc)return G.map(P=>P.length>=3?fitGroups([P],true):null);
  const big=G.reduce((m,g)=>g.length>m.length?g:m,[]),k=kasa(big.length>=3?big:all);if(!k)return null;
  let a=k.a,b=k.b;const m=G.length;let r=G.map(P=>P.length?P.reduce((s,p)=>s+Math.hypot(p.x-a,p.y-b),0)/P.length:0);
  for(let it=0;it<30;it++){const N=2+m,JTJ=Array.from({length:N},()=>new Array(N).fill(0)),JTr=new Array(N).fill(0);
    G.forEach((P,g)=>P.forEach(p=>{const dx=p.x-a,dy=p.y-b,d=Math.hypot(dx,dy)||1e-9,res=d-r[g],J=new Array(N).fill(0);J[0]=-dx/d;J[1]=-dy/d;J[2+g]=-1;
      for(let i=0;i<N;i++){JTr[i]+=J[i]*res;for(let j=0;j<N;j++)JTJ[i][j]+=J[i]*J[j]}}));
    for(let i=0;i<N;i++)JTJ[i][i]+=1e-9;const dl=solve(JTJ,JTr.map(v=>-v));if(!dl)break;
    a+=dl[0];b+=dl[1];for(let g=0;g<m;g++)r[g]+=dl[2+g];if(Math.hypot(dl[0],dl[1])<1e-7)break}
  return{a,b,r}}
function devStats(P,a,b,r){const d=P.map(p=>Math.hypot(p.x-a,p.y-b)-r);return{d,rms:Math.sqrt(d.reduce((s,v)=>s+v*v,0)/(d.length||1)),max:d.reduce((m,v)=>Math.max(m,Math.abs(v)),0)}}
function computeRings(){
  const act=C.rings.filter(r=>r.pts.length>=1),res=new Map();
  if(C.conc){const G=act.map(r=>r.pts);if(G.reduce((s,g)=>s+g.length,0)>=3&&G.some(g=>g.length>=3)){const f=fitGroups(G,true);if(f)act.forEach((r,i)=>res.set(r.id,{a:f.a,b:f.b,r:f.r[i]}))}}
  else act.forEach(r=>{if(r.pts.length>=3){const f=fitGroups([r.pts],true);if(f)res.set(r.id,{a:f.a,b:f.b,r:f.r[0]})}});
  C.rings.forEach(r=>{r.fit=res.get(r.id)||null;r.st=r.fit?devStats(r.pts,r.fit.a,r.fit.b,r.fit.r):null});
}
const fDev=(v,k)=>Math.abs(v)<1e-9?'0':(fK(Math.abs(v),k)+' '+(v>0?'داخل':'خارج')); // v>0 : white line lies outside the ideal circle -> move toward centre
function lmLine(x,y){const k=scaleAt(x,y);return C.lms.map(l=>l.name+': '+fK(Math.hypot(l.x-x,l.y-y),k)).join(' · ')}

// ---------- report ----------
function reportItems(){
  const out=[],H=t=>out.push({t,b:1}),Rw=t=>out.push({t:stripMk(t)});
  const sel=S.pieces.filter(p=>p.sign);
  if(sel.length){H('المساحات (من قطع الـ PDF)');let tot=0;sel.forEach(p=>{tot+=p.sign*p.sf;Rw((p.sign>0?'+ ':'− ')+(p.name||'')+' '+p.sf.toFixed(2)+' sf')});Rw('المجموع: '+tot.toFixed(2)+' sf')}
  const g=colorOrder();if(g.length){H('طلبية المواد (هدر '+M.waste+'%، كيس '+M.bag+' كغ)');let tb=0,bd=0;g.forEach(([k,v])=>{const rb=isRubber(v.key,k),th=colThk(v.key),bg=rb?matBags(v.sf,th):0;tb+=bg;if(rb)bd+=matBind(v.sf,th);Rw(k+': '+v.sf.toFixed(1)+' sf'+(rb?' · '+thkTxt(th)+' → '+bg+' كيس':' (مش مطاط)'))});Rw('المجموع: '+tb+' كيس · غراء ≈ '+bd.toFixed(0)+' كغ')}
  if(S.log.length){H('السجل');S.log.forEach(l=>Rw(l.name+': '+l.sf.toFixed(2)+' sf'))}
  const ls=Ln.lines.filter(l=>l.pts.length>1);if(ls.length){H('الأطوال');ls.forEach((l,i)=>{const m=metrics(l),k=scaleP(l.pts);Rw((l.name||'L'+(i+1))+': '+(k?fFt(m.total/k):Math.round(m.total)+' px'))})}
  if(Ln.probes.length){H('الإحداثيات (من نقطة الأصل)');Ln.probes.forEach(p=>{const c=coordOf(p.x,p.y);Rw(p.name+': X '+cX(c)+' · Y '+cY(c))})}
  if(C.pc.length||C.man.length){H('الدوائر');C.pc.forEach(m=>Rw((m.name||'دائرة '+m.txt)+': القطر '+fFt(2*m.r/m.k)));C.man.forEach((m,i)=>Rw('دائرة يدوية '+(i+1)+': نصف القطر '+fFt(m.rFt)))}
  const sl=SL.items.filter(x=>x.pts.length>1);if(sl.length){H('الميلان');sl.forEach((it,i)=>slSegs(it).forEach(sg=>Rw((it.name||'S'+(i+1))+' '+nameFor(sg.i)+'→'+nameFor(sg.i+1)+': '+slAngle(sg.inf).toFixed(1)+'° · ميل '+(sg.inf.slope===null?'عامودي':sg.inf.slope.toFixed(1)+'%'))))}
  if(N.items.length){H('الزوايا');N.items.forEach((it,i)=>{const P_=it.pts.map(p=>[p.x,p.y]);if(it.t==='a3'){const a=angle3(P_[0],P_[1],P_[2]);if(a)Rw((it.name||'زاوية '+(i+1))+': '+a.theta.toFixed(1)+'° ('+angKind(a.theta)+')')}else{const a=angle4(...P_);if(a)Rw((it.name||'زاوية '+(i+1))+': الحادة '+a.acute.toFixed(1)+'° · المنفرجة '+a.obtuse.toFixed(1)+'°')}})}
  if(!out.length)H('ما في قياسات بعد.');
  return out}
function reportText(){return projTitle()+'\n'+S.name+(S.isPdf?' · صفحة '+S.page:'')+' · '+new Date().toLocaleDateString()+'\n\n'+reportItems().map(x=>x.b?'【'+x.t+'】':x.t).join('\n')}
function makeReport(){
  if(!S.base)return null;saveNow();
  const W=1400,sc=W/S.W,ph=Math.round(S.H*sc),items=reportItems(),lh=36,head=140,c=document.createElement('canvas');
  c.width=W;c.height=head+ph+items.length*lh+60;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,W,c.height);g.fillStyle='#1F2A44';g.fillRect(0,0,W,head-16);
  g.direction='rtl';g.textAlign='right';g.textBaseline='middle';g.fillStyle='#fff';g.font='bold 40px sans-serif';g.fillText(projTitle(),W-30,46);
  g.font='24px sans-serif';g.fillText(S.name+(S.isPdf?' · صفحة '+S.page:'')+' · '+new Date().toLocaleDateString(),W-30,94);
  g.save();g.translate(0,head);g.scale(sc,sc);g.drawImage((S.showAnn&&S.baseAnn)?S.baseAnn:S.base,0,0);
  const keep=S.view,L=[];S.view={s:sc,x:0,y:head};
  try{['areas','lines','circles','angles','slope'].forEach(t=>{try{T[t].draw(g,L)}catch(e){}})}finally{S.view=keep}
  g.restore();g.direction='ltr';g.textAlign='center';g.font='bold 20px sans-serif';
  L.forEach(([x,y,t0,col,oy])=>{if(!col)return;const t=stripMk(t0),sx=x*sc,sy=head+y*sc+(oy||0)*1.5,w=g.measureText(t).width+14;g.fillStyle=col+'EE';g.fillRect(sx-w/2,sy-15,w,30);g.fillStyle='#fff';g.fillText(t,sx,sy+1)});
  let y=head+ph+44;g.direction='rtl';g.textAlign='right';
  items.forEach(it=>{g.font=(it.b?'bold 28px':'24px')+' sans-serif';g.fillStyle=it.b?'#1F2A44':'#1B2233';g.fillText(it.t,W-30,y);y+=lh});
  return c}
function shareReport(){
  const c=makeReport();if(!c){alert('افتح ملف أول.');return}
  const fn=(projTitle()||'report').replace(/[\\/:*?"<>|]+/g,'_')+'.png';
  c.toBlob(async b=>{if(!b){alert('ما قدرت أعمل صورة التقرير.');return}
    const file=typeof File==='function'?new File([b],fn,{type:'image/png'}):b;
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:projTitle(),text:reportText()});return}}catch(e){if(e&&e.name==='AbortError')return}
    const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('انحفظت صورة التقرير بالتنزيلات.')},'image/png')}

  matLog(){if(!S.log.length){alert('السجل فاضي.');return}M.area=S.log.reduce((a,l)=>a+l.sf,0).toFixed(2);renderPanel();matsCalc()},
  denCal(){const n=+$('#cBags').value,A_=+$('#cArea').value;if(!(n>0&&A_>0&&M.thk>0&&M.bag>0)){alert('اكتب عدد الأكياس والمساحة، وتأكد من السماكة ووزن الكيس.');return}
    M.den=n*M.bag/(A_*M.thk/12*28.3168);try{localStorage.setItem('tkDen',M.den.toFixed(5))}catch(e){}$('#cMsg').textContent='الكثافة الفعلية: '+M.den.toFixed(3)+' كغ/لتر. انحفظت واتطبقت.';matsCalc()},
  logDel(d){S.log.splice(+d.i,1);saveLog();renderPanel();matsCalc()},
  logClr(){if(confirm('تمسح كل السجل؟')){S.log=[];saveLog();renderPanel();matsCalc()}},
  logCopy(){copyText(S.log.map(l=>l.name+': '+l.sf.toFixed(2)+' sf').join('\n')+'\nالمجموع: '+S.log.reduce((a,l)=>a+l.sf,0).toFixed(2)+' sf')}
};
function copyText(t){if(!t){alert('ما في شي للنسخ.');return}t=cmText(t).replace(/ · ([\d.]+ cm)/g,' ($1)');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('اننسخ.'),()=>prompt('انسخ النص:',t))}
const CHG={
  cthk(v,d){const x=parseFloat(String(v).replace(',','.'));S.thkC=S.thkC||{};const g=gColThk();if(x>0){const inch=M.tu==='mm'?x/25.4:x;S.thkC[d.k]=inch;g[d.k]=inch}else{delete S.thkC[d.k];delete g[d.k]}try{localStorage.setItem('tkColThk',JSON.stringify(g))}catch(e){}renderPanel();matsCalc()},
  cbag(v,d,t){S.noBag=S.noBag||{};S.noBag[d.k]=!t.checked;try{const g=gNoBag();g[d.k]=!t.checked;localStorage.setItem('tkColNoBag',JSON.stringify(g))}catch(e){}renderPanel();draw()},
  cname(v,d){S.cnames=S.cnames||{};const t=String(v).trim();if(t)S.cnames[d.k]=t;else delete S.cnames[d.k];try{const g=gColNames();if(t)g[d.k]=t;else delete g[d.k];localStorage.setItem('tkColNames',JSON.stringify(g))}catch(e){}applyColorNames();renderPanel();draw()},
  nm(v,d){const lists={line:Ln.lines,sl:SL.items,pc:C.pc,ang:N.items},it=(lists[d.k]||[]).find(x=>x.id===+d.id);if(it){it.name=String(v).trim();renderPanel();draw()}},
  opt(v,d,t){S[d.k]=t.checked;if(d.k==='field'){applyField();renderAll();return}if(d.k==='allTabs'){applyAllTabs();document.querySelectorAll('[data-k="allTabs"]').forEach(x=>x.checked=S.allTabs);renderAll();return}if(d.k==='showAnn'){S.hi=null;scheduleHi()}if(d.k==='cm'){renderAll();return}draw()},
  page(v){if(!S.buf||!S.isPdf){alert('افتح ملف PDF أول.');return}saveNow();const p=Math.max(1,Math.min(S.pages||1,parseInt(v)||1));$('#pageIn').value=p;if(p===S.page&&S.base)return;S.page=p;loadPdf()},
  spacing(v){Ln.spacing=v;renderPanel()},
  manR(v,d){const m=C.man.find(c=>c.id===+d.id),x=parseFloat(v);if(m&&x>0){m.rFt=x;C.lastR=x}renderPanel();draw()}
};
const INP={m(v,d){M[d.k]=d.k==='area'?v:(parseFloat(v)||0);matsCalc()}};
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-a]');if(!t)return;const f=ACT[t.dataset.a];if(f)f(t.dataset,t,e)});
document.addEventListener('change',e=>{const t=e.target.closest&&e.target.closest('[data-c]');if(!t)return;const f=CHG[t.dataset.c];if(f)f(t.value,t.dataset,t)});
document.addEventListener('input',e=>{const t=e.target.closest&&e.target.closest('[data-n]');if(!t)return;const f=INP[t.dataset.n];if(f)f(t.value,t.dataset,t)});
$('#drawer').addEventListener('click',e=>{if(e.target===$('#drawer'))ACT.menu()});
$('#sheet').addEventListener('click',e=>{if(e.target===$('#sheet'))closeSheet()});

// ================= init =================
Object.keys(T).forEach(k=>T[k].reset&&T[k].reset());
try{S.field=localStorage.getItem('tkField')==='1';S.allTabs=localStorage.getItem('tkAllTabs')==='1'}catch(e){}
document.querySelectorAll('[data-k="field"]').forEach(x=>x.checked=S.field);document.querySelectorAll('[data-k="allTabs"]').forEach(x=>x.checked=S.allTabs);
applyField();applyAllTabs();{const vt=document.querySelector('#verTxt');if(vt)vt.textContent='الإصدار '+APP_VER}
renderAll();resize();matsCalc();
try{if(!localStorage.getItem('tkSeen')){localStorage.setItem('tkSeen','1');ACT.guide()}else if(localStorage.getItem('tkVer')!==APP_VER)ACT.news();localStorage.setItem('tkVer',APP_VER)}catch(e){}
</script>
<script>
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
